name: CI Quality Gate

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# A newer push to the same ref supersedes an in-flight run: CI has no side effects.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ══════════════════════════════════════════════════════════════════════════════
jobs:

  # ── Job 1: Static checks, build, unit tests ─────────────────────────────────
  quality:
    name: "Quality — ESLint · madge · knip · TypeScript · Build · Vitest · audit"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint — zero warnings policy
        run: npm run lint

      - name: Circular import check — madge
        run: npm run lint:cycles

      - name: Dead code check — knip
        run: npm run knip

      - name: TypeScript check + prerendered production build
        run: npm run build

      - name: Unit tests — Vitest (with coverage thresholds)
        run: npm run test:coverage

      - name: Dependency audit (high and above)
        run: npm audit --audit-level=high

      # The browser job tests exactly the HTML that would ship, not a rebuild of it.
      - name: Upload prerendered site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site-build
          path: build/client/
          retention-days: 1
          if-no-files-found: error

  # ── Job 2: Browser checks on the built output ───────────────────────────────
  browser:
    name: "Browser — Playwright + axe · Lighthouse"
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download prerendered site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site-build
          path: build/client

      # ubuntu-latest ships google-chrome-stable; playwright.config.ts selects it when CI=true,
      # so there is no browser download.
      - name: E2E — Playwright + axe (WCAG A/AA/AAA)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Performance ≥ 90, the other three categories ≥ 95 (see lighthouserc.json). Performance was
      # relaxed deliberately: a real above-the-fold hero screenshot costs Lighthouse's simulated
      # mobile network a fixed ~400-500ms of FCP/LCP regardless of image weight or loading
      # strategy — investigated in docs/PROGRESS.md (2026-09-28) before lowering the bar.
      - name: Lighthouse CI — performance ≥ 90, accessibility/best-practices/SEO ≥ 95
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
